<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja de Vinil</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja Virtual de Discos de Vinil</h1>
      <button id="cart-toggle" aria-label="Abrir carrinho">Carrinho (<span id="cart-count">0</span>)</button>
    </header>

    <main>
      <section>
        <h2>Catálogo</h2>
        <div id="product-list" class="grid"></div>
      </section>

      <aside id="cart" class="hidden" aria-live="polite">
        <h2>Seu Carrinho</h2>
        <ul id="cart-items"></ul>
        <p id="cart-total">Total: R$ 0,00</p>
        <button id="clear-cart">Limpar carrinho</button>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
